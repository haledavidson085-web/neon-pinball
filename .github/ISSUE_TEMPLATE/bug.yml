name: Bug
description: Report a reproducible problem
title: "[Bug]: "
labels: ["type:bug", "priority:medium", "status:triage"]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem and impact }
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes: { label: Reproduction steps }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected behavior and acceptance criteria }
    validations: { required: true }
  - type: textarea
    id: privacy
    attributes: { label: Privacy and security impact }
    validations: { required: true }
  - type: textarea
    id: testing
    attributes: { label: Regression testing plan }
    validations: { required: true }
  - type: input
    id: owner
    attributes: { label: Owner }
  - type: input
    id: dependencies
    attributes: { label: Dependencies }
  - type: input
    id: release
    attributes: { label: Target release }
